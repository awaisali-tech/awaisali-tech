<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A78BFA"/>
    </marker>
    <marker id="m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#0D1117"/>

  <!-- Left cyan accent bar -->
  <rect x="0" y="0" width="4" height="280" fill="#6EE7F7"/>

  <!-- Subtle right glow -->
  <radialGradient id="rg" cx="85%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#1a1040" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="280" fill="url(#rg)"/>

  <!-- ── LEFT CONTENT ── -->

  <!-- Eyebrow -->
  <text x="40" y="54"
    font-family="'Courier New', Courier, monospace"
    font-size="11" fill="#6EE7F7" letter-spacing="3.5">AI ENGINEER  ·  AGENTIC SYSTEMS</text>

  <!-- Name -->
  <text x="38" y="124"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="60" font-weight="900" fill="#E6EDF3">AWAIS ALI</text>

  <!-- Tagline -->
  <text x="40" y="157"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="14.5" fill="#8B949E">LangChain  ·  LangGraph  ·  FastAPI  ·  RAG  ·  Python</text>

  <!-- Horizontal rule -->
  <line x1="40" y1="173" x2="510" y2="173" stroke="#21262D" stroke-width="1"/>

  <!-- Tag pills -->
  <rect x="40" y="186" width="48" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="64" y="201" font-family="'Courier New', monospace" font-size="11" fill="#6EE7F7" text-anchor="middle">RAG</text>

  <rect x="96" y="186" width="90" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="141" y="201" font-family="'Courier New', monospace" font-size="11" fill="#6EE7F7" text-anchor="middle">LangGraph</text>

  <rect x="194" y="186" width="86" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="237" y="201" font-family="'Courier New', monospace" font-size="11" fill="#6EE7F7" text-anchor="middle">Agentic AI</text>

  <rect x="288" y="186" width="66" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="321" y="201" font-family="'Courier New', monospace" font-size="11" fill="#6EE7F7" text-anchor="middle">FastAPI</text>

  <rect x="362" y="186" width="62" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="393" y="201" font-family="'Courier New', monospace" font-size="11" fill="#6EE7F7" text-anchor="middle">Python</text>

  <!-- Vertical divider -->
  <line x1="660" y1="22" x2="660" y2="258" stroke="#21262D" stroke-width="1"/>

  <!-- ── RIGHT: AGENTIC LOOP DIAGRAM ── -->
  <text x="940" y="32" font-family="'Courier New', monospace" font-size="9"
    fill="#3D444D" text-anchor="middle" letter-spacing="5">AGENTIC LOOP</text>

  <!-- AGENT node (hero) -->
  <rect x="782" y="100" width="122" height="54" rx="9" fill="#1C2128" stroke="#6EE7F7" stroke-width="2.5"/>
  <text x="843" y="123" font-family="'Courier New', monospace" font-size="14"
    fill="#E6EDF3" text-anchor="middle" font-weight="800">AGENT</text>
  <text x="843" y="142" font-family="'Courier New', monospace" font-size="9"
    fill="#6EE7F7" text-anchor="middle">LangGraph</text>

  <!-- TOOLS node -->
  <rect x="996" y="58" width="110" height="50" rx="8" fill="#16121F" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="1051" y="79" font-family="'Courier New', monospace" font-size="12"
    fill="#A78BFA" text-anchor="middle" font-weight="700">TOOLS</text>
  <text x="1051" y="97" font-family="'Courier New', monospace" font-size="9"
    fill="#484F58" text-anchor="middle">LangChain</text>

  <!-- MEMORY node -->
  <rect x="996" y="164" width="110" height="50" rx="8" fill="#16121F" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="1051" y="185" font-family="'Courier New', monospace" font-size="12"
    fill="#A78BFA" text-anchor="middle" font-weight="700">MEMORY</text>
  <text x="1051" y="203" font-family="'Courier New', monospace" font-size="9"
    fill="#484F58" text-anchor="middle">ChromaDB</text>

  <!-- INPUT label + arrow into AGENT -->
  <text x="736" y="117" font-family="'Courier New', monospace" font-size="9"
    fill="#34D399" text-anchor="middle">INPUT</text>
  <line x1="700" y1="127" x2="780" y2="127" stroke="#34D399" stroke-width="1.5"
    marker-end="url(#m-green)"/>

  <!-- AGENT → TOOLS (solid) -->
  <line x1="904" y1="115" x2="994" y2="80" stroke="#A78BFA" stroke-width="1.5"
    marker-end="url(#m-violet)"/>

  <!-- TOOLS → AGENT (dashed return) -->
  <line x1="994" y1="89" x2="905" y2="126" stroke="#A78BFA" stroke-width="1"
    stroke-dasharray="4,3" marker-end="url(#m-violet)"/>

  <!-- AGENT → MEMORY (solid) -->
  <line x1="904" y1="143" x2="994" y2="176" stroke="#A78BFA" stroke-width="1.5"
    marker-end="url(#m-violet)"/>

  <!-- MEMORY → AGENT (dashed return) -->
  <line x1="994" y1="168" x2="905" y2="136" stroke="#A78BFA" stroke-width="1"
    stroke-dasharray="4,3" marker-end="url(#m-violet)"/>

  <!-- TOOLS ↔ MEMORY dotted connector -->
  <line x1="1051" y1="108" x2="1051" y2="164" stroke="#2D333B" stroke-width="1"
    stroke-dasharray="2,4"/>

  <!-- OUTPUT arrow down from AGENT -->
  <line x1="843" y1="154" x2="843" y2="238" stroke="#34D399" stroke-width="1"
    stroke-dasharray="3,3" marker-end="url(#m-green)"/>
  <text x="843" y="250" font-family="'Courier New', monospace" font-size="9"
    fill="#34D399" text-anchor="middle">↓ RESPONSE</text>

</svg>
